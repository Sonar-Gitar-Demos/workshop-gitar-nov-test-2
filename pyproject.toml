[build-system]
requires = ["setuptools>=61"]
build-backend = "build_backend"
backend-path = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["boxoffice"]
known-local-folder = ["helpers"]
